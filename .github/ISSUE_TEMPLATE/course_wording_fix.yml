name: Course - wording or pronunciation fix
description: A better phrase for a course script, caption or title, or a technical term the voice mispronounces.
title: "[Course]: "
labels: [bug]
body:
  - type: input
    id: episode
    attributes:
      label: Episode
      description: The id and title.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text, and why
    validations:
      required: true
