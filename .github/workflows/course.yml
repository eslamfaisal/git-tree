name: course

# The course folder stays consistent: one feature per episode, both languages, no other product's name, media in LFS
# or under the size limit, and the README table matches the episode files.
on:
  push:
    paths: ['course/**', '.gitattributes', '.github/workflows/course.yml']
  pull_request:
    paths: ['course/**', '.gitattributes', '.github/workflows/course.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          lfs: false
      - run: pip install pyyaml
      - run: python3 course/tooling/validate_course.py
      - run: python3 course/tooling/generate_index.py --check
