# split-check
# Each series with the inventory feature ids its episodes cover (a feature used by several episodes is a split into sub-tasks).
# 00-start-here (13 episodes, 13 features): install-macos, install-windows, install-linux-deb, install-linux-appimage,
#   install-linux-verify, repos-git-setup, signin-dialog, repos-open, trust-dialog, repos-clone-url, repos-init,
#   repos-recents, view-panels
# 01-git-foundations (12 episodes, 12 features): graph-detail, graph-render, graph-ref-pills, graph-jump-head,
#   staging-panel, branch-panel, remote-crud, tag-create, sync-fetch, branch-ff, graph-ref-drop, settings-git-config
# 02-daily-workflow (30 episodes, 29 features): staging-file, staging-hunk, staging-lines, staging-unstage-file,
#   commit-create, commit-message-assist, commit-amend, commit-options, commit-coauthors, commit-hooks, commit-ai-
#   draft, staging-discard, staging-discard-all, staging-ignore, staging-gitignore-editor, diff-view-modes, diff-nav,
#   diff-options, diff-image, diff-file-view, diff-compare, diff-restore-file, blame-view, blame-step-back, history-
#   file, graph-wip-row, graph-search, stash-save, stash-pop
# 03-branching-and-merging (20 episodes, 17 features): branch-create, branch-checkout, branch-rename, branch-delete,
#   branch-upstream, tag-annotated, tag-delete, merge-preview, merge-run, merge-banner, merge-abort, conflict-list,
#   conflict-editor, conflict-whole-file, conflict-merge-tool, merge-gitflow, graph-conflict-chip
# 04-rewriting-history (19 episodes, 19 features): rebase-onto, rebase-interactive, rebase-reword, rebase-drop,
#   rebase-move, rebase-squash, rebase-published-guard, pick-cherry, revert-commit, reset-soft, reset-mixed, reset-
#   hard, undo-redo, trash-refs, reflog-view, reflog-restore, bisect, patch-create, patch-apply
# 05-collaboration (29 episodes, 27 features): sync-push, sync-destination, sync-pull-ff, sync-pull-merge, sync-pull-
