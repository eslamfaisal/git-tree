# GitTree video course: curriculum (series and episodes).
# One video = one feature (or one lesson). `feature` is a single inventory id; where a feature has sub-tasks the same id
# appears in several episodes (staging-hunk, merge-run, merge-gitflow, pr-view, branch-checkout, submodule-lifecycle).
# Source of truth for features: course/inventory.md (GitTree 1.2.1). Arabic titles are drafts for native review.

series:
  - id: "00-start-here"
    title_en: "Start here: install, sign in, open a repository"
    title_ar: "ابدأ من هنا: التثبيت وتسجيل الدخول وفتح مستودع"
    summary_en: "Install GitTree on macOS, Windows or Linux, sign in with your website account, then open, clone or create your first repository."
  - id: "01-git-foundations"
    title_en: "Git foundations: the ideas behind every click"
    title_ar: "أساسيات Git: الأفكار وراء كل نقرة"
    summary_en: "The core Git concepts (commit, the graph, refs, HEAD, the three trees, remotes, tags, merge versus rebase), each shown with one GitTree feature."
  - id: "02-daily-workflow"
    title_en: "Daily workflow: stage, commit, review"
    title_ar: "العمل اليومي: التجهيز والحفظ والمراجعة"
    summary_en: "Stage files, hunks and lines, write and amend commits, read diffs, blame and file history, and stash work in progress."
  - id: "03-branching-and-merging"
    title_en: "Branching and merging"
    title_ar: "الفروع والدمج"
    summary_en: "Create, switch, rename and delete branches, tag releases, merge, squash, resolve conflicts and use Gitflow."
  - id: "04-rewriting-history"
    title_en: "Rewriting history and getting out of trouble"
    title_ar: "إعادة كتابة السجل والتراجع عن الأخطاء"
    summary_en: "Rebase, interactive rebase, cherry-pick, revert, reset, Undo, the reflog, bisect and patches, with GitTree's recovery snapshots as the safety net."
  - id: "05-collaboration"
    title_en: "Collaboration: remotes, pull requests, providers"
    title_ar: "التعاون: المستودعات البعيدة وطلبات الدمج والمنصات"
    summary_en: "Push, pull and force-push safely, connect GitHub, GitLab, Bitbucket and Azure DevOps, and work with pull requests and issues."
  - id: "06-power-features"
    title_en: "Power features: worktrees, submodules, LFS, search"
    title_ar: "ميزات متقدمة: أشجار العمل والوحدات الفرعية وLFS والبحث"
    summary_en: "Worktrees, submodules, Git LFS, sparse and shallow clones, stash options, maintenance, workspaces, the command palette, the terminal and custom commands."
  - id: "07-customise-and-troubleshoot"
    title_en: "Customise GitTree and fix problems"
    title_ar: "خصّص GitTree وحلّ المشاكل"
    summary_en: "Preferences, themes, language, profiles, SSH, signing, external tools, shortcuts, the activity log, updates, restricted mode and the startup screens."

episodes:
  # ---------------------------------------------------------------- 00-start-here
  - id: "00-01"
    series: "00-start-here"
    slug: "install-gittree-on-macos"
    title_en: "Install GitTree on macOS (Apple silicon and Intel)"
    title_ar: "تثبيت GitTree على macOS (آبل سيليكون وإنتل)"
    promise_en: "Install the universal GitTree disk image on a Mac and get past the first-launch warning."
    concept: "GitTree is a front end for the Git already on your computer, so Git must be installed first."
    feature: "install-macos"
    commands: ["git --version", "xcode-select --install"]
    checkpoint: "no-repo"
    duration_min: 4
    requires: []
    platforms: ["macos"]
    notes: "VERIFY V5: Gatekeeper wording is from ALPHA_NOTES (v0.1.0), no 1.2.1 first-launch run recorded. Installer not notarized (P12-T04 blocked), so show the context-menu open. macOS 13 or later. Ledger verified on Linux only: a macOS recording is a new observation."
  - id: "00-02"
    series: "00-start-here"
    slug: "install-gittree-on-windows"
    title_en: "Install GitTree on Windows 10 and 11"
    title_ar: "تثبيت GitTree على ويندوز 10 و11"
    promise_en: "Run the GitTree setup on Windows and get past the SmartScreen warning."
    concept: "GitTree uses Git for Windows as its Git, and needs version 2.39 or newer."
    feature: "install-windows"
    commands: ["git --version"]
    checkpoint: "no-repo"
    duration_min: 4
    requires: []
    platforms: ["windows"]
    notes: "VERIFY V5: SmartScreen wording from ALPHA_NOTES (More info, then Run anyway). Installer not signed (P12-T05 blocked). The installer installs for all users and asks for administrator permission. Windows 10 22H2 or 11, 64-bit. Ledger verified on Linux only."
  - id: "00-03"
    series: "00-start-here"
    slug: "install-gittree-on-ubuntu-debian"
    title_en: "Install GitTree on Ubuntu and Debian (.deb)"
    title_ar: "تثبيت GitTree على أوبونتو وديبيان (حزمة deb)"
    promise_en: "Install the .deb package with apt and start GitTree from the menu."
    concept: "apt resolves dependencies for a local package, and GitTree needs Git 2.39 or newer."
    feature: "install-linux-deb"
    commands: ["sudo apt install ./Git-Tree-Linux.deb", "git --version"]
    checkpoint: "no-repo"
    duration_min: 4
    requires: []
    platforms: ["linux"]
    notes: "Ubuntu 22.04 LTS or later, Debian 12 or later, x86_64 only. Ubuntu 22.04 and Mint 21 ship Git 2.34, so add ppa:git-core/ppa first. Verified on a 24.04 container only (not 22.04, not Wayland). Installer is unsigned. Say nothing about Flatpak, Snap, an apt repository or arm64."
  - id: "00-04"
    series: "00-start-here"
    slug: "run-gittree-appimage"
    title_en: "Run GitTree on Linux with the AppImage (no root)"
    title_ar: "تشغيل GitTree على لينكس بصيغة AppImage دون صلاحيات root"
    promise_en: "Make the AppImage executable and run GitTree without installing anything."
    concept: "A portable AppImage runs from any folder and does not register the opengittree:// link handler."
    feature: "install-linux-appimage"
    commands: ["chmod +x Git-Tree-Linux.AppImage", "./Git-Tree-Linux.AppImage"]
    checkpoint: "no-repo"
    duration_min: 3
    requires: ["00-03"]
    platforms: ["linux"]
    notes: "x86_64 only, unsigned. The AppImage registers no opengittree:// handler, so browser sign-in may need the manual code (see 00-07). Verified on a 24.04 container only. Do not discuss in-app updates on Linux (VERIFY V6)."
  - id: "00-05"
    series: "00-start-here"
    slug: "verify-linux-download"
    title_en: "Verify a GitTree Linux download with SHA256SUMS"
    title_ar: "التحقق من ملف GitTree على لينكس باستخدام SHA256SUMS"
    promise_en: "Check that a downloaded installer matches the checksum published with the release."
    concept: "A checksum catches a corrupt download but not a compromised release."
    feature: "install-linux-verify"
    commands: ["sha256sum -c SHA256SUMS.txt"]
    checkpoint: "no-repo"
    duration_min: 3
    requires: ["00-03"]
    platforms: ["linux"]
    notes: "Installers are unsigned; say plainly that SHA256SUMS.txt detects corruption, not tampering with the release itself."
  - id: "00-06"
    series: "00-start-here"
    slug: "git-version-required"
    title_en: "Which Git version does GitTree need? (2.39 or newer)"
    title_ar: "ما إصدار Git الذي يحتاجه GitTree؟ (2.39 أو أحدث)"
    promise_en: "Check your Git version and read the two screens GitTree shows when Git is missing or too old."
    concept: "GitTree never bundles Git: it runs the git command you already have."
    feature: "repos-git-setup"
    commands: ["git --version"]
    checkpoint: "no-repo"
    duration_min: 3
    requires: ["00-03"]
    platforms: ["linux"]
    notes: "Screens are 'GitTree needs Git' and 'This Git is too old'. Status done (P00-T11)."
  - id: "00-07"
    series: "00-start-here"
    slug: "sign-in-first-launch"
    title_en: "Sign in to GitTree on first launch (website account)"
    title_ar: "تسجيل الدخول إلى GitTree عند أول تشغيل بحساب الموقع"
    promise_en: "Sign in through the GitTree website from the app, including the manual code fallback."
    concept: "Your GitTree account (website) is separate from your Git identity and your hosting accounts."
    feature: "signin-dialog"
    commands: []
    checkpoint: "no-repo"
    duration_min: 4
    requires: ["00-03"]
    platforms: ["linux"]
    notes: "Official builds only. VERIFY V8: which providers the website offers is decided by the backend, confirm before naming them. The sign-in is PKCE through opengittree://auth/callback; the AppImage has no handler, so show 'Manually enter authentication code'. Never show a real code or token on screen."
  - id: "00-08"
    series: "00-start-here"
    slug: "open-a-repository"
    title_en: "Open a Git repository in GitTree (folder or drag and drop)"
    title_ar: "فتح مستودع Git في GitTree (من مجلد أو بالسحب والإفلات)"
    promise_en: "Open an existing repository from the New Tab page, the Open shortcut or a dropped folder."
    concept: "A repository is a working folder plus a .git directory."
    feature: "repos-open"
    commands: ["git rev-parse --git-dir --is-inside-work-tree"]
    checkpoint: "clean"
    duration_min: 3
    requires: ["00-07"]
    platforms: ["linux"]
    notes: "Shortcut Mod+O (Cmd on macOS, Ctrl on Windows and Linux)."
  - id: "00-09"
    series: "00-start-here"
    slug: "trust-prompt-on-open"
    title_en: "Trust this repository? What GitTree checks before it opens"
    title_ar: "هل تثق بهذا المستودع؟ ما يفحصه GitTree قبل فتحه"
    promise_en: "Read the trust prompt and choose between Restricted Mode and Trust and Open."
    concept: "A cloned repository's config and hooks can run programs on your machine."
    feature: "trust-dialog"
    commands: ["git config --list --show-scope --show-origin"]
    checkpoint: "cloned-with-hooks"
    duration_min: 4
    requires: ["00-08"]
    platforms: ["linux"]
    notes: "VERIFY V12: quote the dialog body from en.ts, the inventory text is cut off. Restricted Mode itself is 07-17."
  - id: "00-10"
    series: "00-start-here"
    slug: "clone-a-repository"
    title_en: "Clone a Git repository by URL in GitTree"
    title_ar: "استنساخ مستودع Git من رابط في GitTree"
    promise_en: "Clone a repository from a URL into a folder you choose and open it."
    concept: "A clone copies the full history and sets the remote named origin."
    feature: "repos-clone-url"
    commands: ["git clone <url> <dest>"]
    checkpoint: "no-repo"
    duration_min: 4
    requires: ["00-07"]
    platforms: ["linux"]
    notes: "Use a local demo remote, never a real URL with a token (a pasted token is stripped and never saved). Clone options are 06-12; cloning from a connected account is 05-18."
  - id: "00-11"
    series: "00-start-here"
    slug: "init-a-repository"
    title_en: "Create a new Git repository in GitTree (git init)"
    title_ar: "إنشاء مستودع Git جديد في GitTree (git init)"
    promise_en: "Initialise a new repository with a first branch name and an optional .gitignore template and licence."
    concept: "git init creates the object database and the first branch."
    feature: "repos-init"
    commands: ["git init --initial-branch main"]
    checkpoint: "no-repo"
    duration_min: 4
    requires: ["00-07"]
    platforms: ["linux"]
    notes: ""
  - id: "00-12"
    series: "00-start-here"
    slug: "recent-repositories"
    title_en: "Recent repositories and the New Tab page in GitTree"
    title_ar: "المستودعات الأخيرة وصفحة التبويب الجديد في GitTree"
    promise_en: "Reopen a repository from the Recent list and remove one from it without deleting files."
    concept: "The recent list is stored by the app, nothing in the repository changes."
    feature: "repos-recents"
    commands: []
    checkpoint: "clean"
    duration_min: 3
    requires: ["00-08"]
    platforms: ["linux"]
    notes: "Favourites (repos-favourites) are mentioned in one sentence here, not a separate video."
  - id: "00-13"
    series: "00-start-here"
    slug: "tour-of-the-window"
    title_en: "GitTree window tour: sidebar, graph, inspector, drawer"
    title_ar: "جولة في نافذة GitTree: الشريط الجانبي والرسم واللوحة السفلية"
    promise_en: "Learn where the four areas of the window are and how to toggle each one."
    concept: "The window is a view over one repository: refs on the left, history in the centre, details on the right."
    feature: "view-panels"
    commands: []
    checkpoint: "clean"
    duration_min: 4
    requires: ["00-08"]
    platforms: ["linux"]
    notes: "Shortcuts Mod+J (sidebar), Mod+K (inspector), Alt+T (drawer), Escape (Back). No default chord exists for Push, Pull, Fetch, Stash, Branch or Undo: use the toolbar."

  # ---------------------------------------------------------------- 01-git-foundations
  - id: "01-01"
    series: "01-git-foundations"
    slug: "what-is-a-commit"
    title_en: "What is a Git commit? See one in GitTree"
    title_ar: "ما هو الـ commit في Git؟ شاهد واحدًا في GitTree"
    promise_en: "See that a commit is a snapshot with a parent, a message and an author, using the Commit Details panel."
    concept: "A commit is a snapshot (tree) plus parents, message, author and committer."
    feature: "graph-detail"
    commands: ["git show --stat <sha>", "git cat-file -p <sha>"]
    checkpoint: "clean"
    duration_min: 5
    requires: ["00-08"]
    platforms: ["linux"]
    notes: ""
  - id: "01-02"
    series: "01-git-foundations"
    slug: "commit-graph-dag"
    title_en: "The Git commit graph explained: history is a DAG"
    title_ar: "شرح رسم الـ commits في Git: السجل شبكة موجَّهة"
    promise_en: "Read the commit graph: parents, lanes and why history is a graph and not a line."
    concept: "History is a directed acyclic graph in which lanes show parallel lines of work."
    feature: "graph-render"
    commands: ["git log --graph --oneline --all"]
    checkpoint: "clean"
    duration_min: 5
    requires: ["01-01"]
    platforms: ["linux"]
    notes: ""
  - id: "01-03"
    series: "01-git-foundations"
    slug: "branches-are-pointers"
    title_en: "Git branches are just pointers (refs explained)"
    title_ar: "الفروع في Git مجرد مؤشّرات: شرح الـ refs"
    promise_en: "See branch pills on the graph and learn that a ref is a movable name for a commit."
    concept: "A ref (branch name) is a movable pointer to a commit."
    feature: "graph-ref-pills"
    commands: ["git branch -v", "git show-ref"]
    checkpoint: "clean"
    duration_min: 5
    requires: ["01-02"]
    platforms: ["linux"]
    notes: "Tag pills are introduced here by sight only; tags have their own video (01-08)."
  - id: "01-04"
    series: "01-git-foundations"
    slug: "what-is-head"
    title_en: "What is HEAD in Git? Find it in GitTree"
    title_ar: "ما هو HEAD في Git؟ اعثر عليه في GitTree"
    promise_en: "Jump to HEAD and see what the checked-out branch and a detached HEAD look like."
    concept: "HEAD is the current commit, usually through the checked-out branch."
    feature: "graph-jump-head"
    commands: ["git rev-parse HEAD", "git symbolic-ref HEAD"]
    checkpoint: "clean"
    duration_min: 4
    requires: ["01-03"]
    platforms: ["linux"]
    notes: "Shortcut Mod+Shift+H."
  - id: "01-05"
    series: "01-git-foundations"
    slug: "three-trees-and-the-index"
    title_en: "Git working tree, index and HEAD: the three trees"
    title_ar: "شجرة العمل والـ index وHEAD في Git: الأشجار الثلاث"
    promise_en: "Use the Working Changes panel to see the working folder, the index and HEAD as three different states."
    concept: "Git compares three trees: the working tree, the index (staging area) and HEAD."
    feature: "staging-panel"
    commands: ["git status", "git diff", "git diff --staged"]
    checkpoint: "two-files-modified"
    duration_min: 6
    requires: ["01-04"]
    platforms: ["linux"]
    notes: ""
  - id: "01-06"
    series: "01-git-foundations"
    slug: "local-vs-remote-branches"
    title_en: "Local vs remote branches in Git (origin/main explained)"
    title_ar: "الفروع المحلية والبعيدة في Git: شرح origin/main"
    promise_en: "Read the left panel and the ahead and behind counts to tell local branches from remote-tracking ones."
    concept: "A remote-tracking branch is your local record of where the remote's branch was at the last fetch."
    feature: "branch-panel"
    commands: ["git branch -vv", "git branch -r"]
    checkpoint: "ahead-of-remote"
    duration_min: 5
    requires: ["01-03"]
    platforms: ["linux"]
    notes: ""
  - id: "01-07"
    series: "01-git-foundations"
    slug: "what-is-a-remote"
    title_en: "What is a Git remote? Add, edit and remove one"
    title_ar: "ما هو الـ remote في Git؟ إضافة وتعديل وحذف"
    promise_en: "Add, edit and remove a remote and see that it is only a name for a URL."
    concept: "A remote is a named URL (with an optional separate push URL)."
    feature: "remote-crud"
    commands: ["git remote add origin <url>", "git remote set-url origin <url>", "git remote remove origin"]
    checkpoint: "clean"
    duration_min: 5
    requires: ["01-06"]
    platforms: ["linux"]
    notes: ""
  - id: "01-08"
    series: "01-git-foundations"
    slug: "git-tags-explained"
    title_en: "Git tags explained: create a tag in GitTree"
    title_ar: "شرح الـ tags في Git: أنشئ tag في GitTree"
    promise_en: "Create a lightweight tag on a commit and see it as a pill in the graph."
    concept: "A lightweight tag is a fixed name on a commit."
    feature: "tag-create"
    commands: ["git tag <name> <sha>"]
    checkpoint: "clean"
    duration_min: 4
    requires: ["01-03"]
    platforms: ["linux"]
    notes: "Annotated tags are 03-07; deleting and pushing tags are 03-08 and 05-10."
  - id: "01-09"
    series: "01-git-foundations"
    slug: "fetch-without-changing-files"
    title_en: "Git fetch explained: download without changing your files"
    title_ar: "شرح git fetch: تنزيل التحديثات دون تغيير ملفاتك"
    promise_en: "Run Fetch All and watch only the remote-tracking branches move while your files stay put."
    concept: "Fetch updates remote-tracking refs and never touches your working files or your branches."
    feature: "sync-fetch"
    commands: ["git fetch --all --prune", "git fetch <remote>"]
    checkpoint: "behind-remote"
    duration_min: 4
    requires: ["01-06"]
    platforms: ["linux"]
    notes: "Fetch is reached from the Pull caret ('Pull options'), no default chord."
  - id: "01-10"
    series: "01-git-foundations"
    slug: "what-is-a-fast-forward"
    title_en: "What is a Git fast-forward? Move a branch pointer"
    title_ar: "ما هو الـ fast-forward في Git؟ تحريك مؤشر الفرع"
    promise_en: "Fast-forward a branch to its upstream and see that only the pointer moves."
    concept: "A fast-forward moves a branch pointer along a straight line and creates no commit."
    feature: "branch-ff"
    commands: ["git merge-base --is-ancestor <a> <b>", "git merge --ff-only <b>"]
    checkpoint: "behind-remote"
    duration_min: 4
    requires: ["01-09"]
    platforms: ["linux"]
    notes: ""
  - id: "01-11"
    series: "01-git-foundations"
    slug: "merge-vs-rebase"
    title_en: "Git merge vs rebase: the difference on the graph"
    title_ar: "الفرق بين git merge وgit rebase على الرسم"
    promise_en: "Drag one branch onto another and compare what Merge and Rebase do to the graph."
    concept: "Merge joins two lines of history with a new commit; rebase replays commits with new ids."
    feature: "graph-ref-drop"
    commands: ["git merge <branch>", "git rebase <branch>"]
    checkpoint: "diverged-branches"
    duration_min: 6
    requires: ["01-10"]
    platforms: ["linux"]
    notes: "Concept video only; the full merge and rebase workflows are 03-10 and 04-01."
  - id: "01-12"
    series: "01-git-foundations"
    slug: "git-config-scopes"
    title_en: "Git config scopes: system, global and local explained"
    title_ar: "نطاقات إعدادات Git: النظام والعام والمحلي"
    promise_en: "Change a Git setting at the global and the local level from Preferences and see which one wins."
    concept: "Git settings live in scopes (system, global, local) and the narrowest scope wins."
    feature: "settings-git-config"
    commands: ["git config --list --show-scope", "git config --global <key> <value>", "git config --local <key> <value>"]
    checkpoint: "clean"
    duration_min: 5
    requires: ["01-07"]
    platforms: ["linux"]
    notes: "The system level is read-only in the app. The Preferences window itself is 07-01."

  # ---------------------------------------------------------------- 02-daily-workflow
  - id: "02-01"
    series: "02-daily-workflow"
    slug: "stage-a-file"
    title_en: "Stage a file in GitTree (git add explained)"
    title_ar: "كيف تُجهِّز ملفًا في GitTree (شرح git add)"
    promise_en: "Stage one changed file so that it goes into the next commit and the others do not."
    concept: "Staging copies a file's changes into the index, which is the next commit."
    feature: "staging-file"
    commands: ["git add -A -- <path>", "git status"]
    checkpoint: "two-files-modified"
    duration_min: 3
    requires: ["01-05"]
    platforms: ["linux"]
    notes: "Shortcut S works when the file list has focus. Path and Tree layout (staging-layout) is shown in passing."
  - id: "02-02"
    series: "02-daily-workflow"
    slug: "stage-a-single-hunk"
    title_en: "Stage a single hunk in GitTree (commit part of a file)"
    title_ar: "كيف تُجهِّز Hunk واحدًا في GitTree وتحفظ جزءًا من الملف"
    promise_en: "Commit only one of two changes in the same file, without touching the other."
    concept: "The staging area (index) decides what a commit contains; a hunk is the unit of a change."
    feature: "staging-hunk"
    commands: ["git add -p", "git diff --staged"]
    checkpoint: "two-hunks"
    duration_min: 3.5
    requires: []
    platforms: ["linux"]
    notes: "The pilot episode, kept exactly as in curriculum/02-daily-workflow/stage-a-single-hunk/episode.yml."
  - id: "02-03"
    series: "02-daily-workflow"
    slug: "stage-single-lines"
    title_en: "Stage single lines in GitTree (partial commit)"
    title_ar: "جهِّز أسطرًا محددة في GitTree لحفظ جزء من التعديل"
    promise_en: "Pick individual changed lines and stage only those."
    concept: "A patch can be narrowed to single lines before it enters the index."
    feature: "staging-lines"
    commands: ["git add -p (then e to edit the hunk)", "git apply --cached"]
    checkpoint: "mixed-lines"
    duration_min: 4
    requires: ["02-02"]
    platforms: ["linux"]
    notes: "Shift+click picks a range of lines. Binary files, renames, LFS pointers, mode changes and submodules are staged whole (staging-whole-only), mention in one sentence."
  - id: "02-04"
    series: "02-daily-workflow"
    slug: "unstage-a-file"
    title_en: "Unstage a file in GitTree (undo git add)"
    title_ar: "إلغاء تجهيز ملف في GitTree (التراجع عن git add)"
    promise_en: "Move a staged file back to the unstaged list without losing any edit."
    concept: "Unstaging resets the index entry and leaves the file on disk untouched."
    feature: "staging-unstage-file"
    commands: ["git restore --staged -- <path>", "git reset -q"]
    checkpoint: "two-files-modified"
    duration_min: 3
    requires: ["02-01"]
    platforms: ["linux"]
    notes: "Shortcut U works when the file list has focus."
  - id: "02-05"
    series: "02-daily-workflow"
    slug: "make-a-commit"
    title_en: "Make a Git commit in GitTree step by step"
    title_ar: "كيف تُنشئ commit في GitTree خطوة بخطوة"
