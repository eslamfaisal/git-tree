# One entry per beat: the words, and the picture they play over (see course/AUTHORING.md).
beats:
  - id: hook
    chapter: "Why pick single lines"
    scene:
      template: hook
      data:
        tag: "Daily workflow · Staging"
        kicker: "GitTree lesson"
        title: "Stage single lines"
        subtitle: "One hunk, two ideas. Stage Hunk would take both."
        question: "How do you take only the new method?"
        snippet:
          file: "src/search/index.ts"
          lines:
            - [ctx, 7, "add(note: Note): void {"]
            - [del, 8, "for (const token of tokenize(`${note.title} ${note.body}`)) {"]
            - [add, 8, "for (const token of tokenize(`… ${note.tags.join(' ')}`)) {"]
            - [ctx, 14, "}"]
            - [add, 15, "/** How many distinct words are indexed. */"]
            - [add, 16, "size(): number {"]
    vo: "You added a new method, and a few lines above it you changed something unrelated. Git puts both changes in one hunk, so Stage Hunk would take them together. In this video you will pick single lines in {GitTree|git tree}, and stage only the method."

  - id: hunk-to-line
    chapter: "From hunk to line"
    scene:
      template: cards
      data:
        tag: "Daily workflow · Staging"
        title: "From hunk to line"
        cards:
          - {label: "Last lesson", title: "Stage Hunk", text: "One whole block of changed lines."}
          - {label: "This lesson", title: "Stage Lines", text: "Only the lines you pick.", highlight: true}
        footer: "The lines you do not pick stay in your working changes."
    vo: "Last time you staged a whole hunk, one block of changed lines. When two ideas share a hunk, that is too coarse. So {GitTree|git tree} goes one level down: you pick the lines, and only those are staged."

  - id: see-hunk
    chapter: "One hunk, two changes"
    app: {from: start, to: pick-before, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 1, text: "Open the file's diff"}
      - {type: box, rect: hunk, from: hunk-shown, to: pick-before, pad: 4, color: [240, 138, 74]}
    vo: "Here is {GitTree|git tree} with a small demo project. Open the working changes, and select the search index file. Its diff is a single hunk with two changes: tags added to the index, and a new size method. Only the size method belongs in this commit."

  - id: pick
    chapter: "Pick the lines"
    app: {from: pick-before, to: picked, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 2, text: "Pick the lines of the new method"}
      - {type: keys, keys: ["Shift", "Click"], from: first-picked, to: picked}
    vo: "Every changed line has a checkbox. Click the first line of the new method. Then hold Shift, and click the last line. Shift picks the whole range between them."

  - id: stage
    chapter: "Stage Lines"
    app: {from: picked, to: stage-after, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 3, text: "Click Stage Lines"}
      - {type: box, rect: range, from: picked, to: stage-before, pad: 2, color: [176, 124, 240]}
      - {type: box, rect: stage-button, from: stage-before, to: stage-after, pad: 5, color: [176, 124, 240]}
    vo: "The toolbar counts five lines picked. Now click Stage Lines, and only those lines move to the staging area."

  - id: lists
    chapter: "One file, two lists"
    app: {from: lists-begin, to: staged-view-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 4, text: "Check what is staged"}
      - {type: box, rect: unstaged-row, from: lists-begin, to: lists-mid, pad: 3, color: [240, 138, 74]}
      - {type: box, rect: staged-row, from: lists-mid, to: staged-view, pad: 3, color: [176, 124, 240]}
      - {type: box, rect: staged-view, from: staged-view, to: staged-view-end, pad: 4, color: [176, 124, 240]}
    vo: "The file is now in both lists. Under Unstaged Files, it still holds the tags change. Under Staged Files, it holds only the new method. Click it to check."

  - id: commit
    chapter: "Commit"
    app: {from: msg-before, to: rest-end, camera: {center: [776, 420], zoom: 1.27}}
    overlays:
      - {type: step, n: 5, text: "Commit, then check what is left"}
    vo: "Write a message, and commit. The button says Commit Changes to 1 File, because one file is staged. This commit holds only the new method. Now select the file again. The tags change is still there, ready for its own commit."

  - id: tips
    chapter: "Two things to know"
    scene:
      template: steps
      data:
        tag: "Daily workflow · Staging"
        title: "Two things to know"
        steps:
          - "Changed your mind? In the staged copy of the file, pick lines and click <b>Unstage Lines</b>."
          - "Binary files, renames, Git LFS pointers, mode changes and submodules are always staged <b>whole</b>."
    vo: "Two things to know. If you change your mind, pick lines in the staged copy, and click Unstage Lines. And some changes cannot be split: binary files, renames, Git LFS pointers, mode changes and submodules are always staged whole."

  - id: git-command
    chapter: "The same in plain Git"
    scene:
      template: terminal
      data:
        tag: "Daily workflow · Staging"
        cwd: "lumen — git 2.43"
        lines:
          - {k: cmd, t: "git add -p"}
          - {k: q, t: "(1/1) Stage this hunk [y,n,q,a,d,s,e,?]? s"}
          - {k: dim, t: "Split into 2 hunks."}
          - {k: hunk, t: "@@ -5,10 +5,10 @@ export class SearchIndex {"}
          - {k: q, t: "(1/2) Stage this hunk [y,n,q,a,d,j,J,g,/,e,?]? n"}
          - {k: hunk, t: "@@ -9,9 +9,14 @@"}
          - {k: add, t: "+  /** How many distinct words are indexed. */"}
          - {k: add, t: "+  size(): number {"}
          - {k: add, t: "+    return this.postings.size;"}
          - {k: add, t: "+  }"}
          - {k: q, t: "(2/2) Stage this hunk [y,n,q,a,d,K,g,/,e,?]? y"}
          - {k: cmd, t: "git diff --staged --stat"}
          - {k: dim, t: " src/search/index.ts | 5 +++++"}
          - {k: dim, t: " 1 file changed, 5 insertions(+)"}
        keys:
          - ["s", "split the hunk"]
          - ["n / y", "skip / stage"]
          - ["e", "edit by hand"]
        note: "Each hunk is shortened here. GitTree builds a narrowed patch from your picked lines and applies it with git apply --cached."
    vo: "In plain Git, {git add -p|git add dash p} walks through the hunks. Press s to split this one in two, answer n to the first part and y to the second, and {git diff --staged|git diff dash dash staged} shows what will be committed. If changes touch, press e to edit the hunk by hand. {GitTree|git tree} builds that patch for you."

  - id: recap
    chapter: "Recap"
    scene:
      template: recap
      data:
        tag: "Daily workflow · Staging"
        points:
          - "Pick changed lines, and Shift+click picks a range."
          - "Stage Lines stages only the lines you picked."
          - "The other lines stay in your working changes."
        next: "Next: <b>unstage a file</b>"
    vo: "To recap: pick lines, with Shift to pick a range, click Stage Lines, and only those lines are staged. The rest waits in your working changes. Download {GitTree|git tree} free at {gittree.app|gittree dot app}. Next, how to unstage a file."
