<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.row { position: absolute; top: 250px; inset-inline: 120px; display: flex; gap: 120px; }
.area { width: 480px; height: 640px; padding: 34px; position: relative; }
.area h3 { font-size: 40px; font-weight: 680; margin-bottom: 8px; }
.area p { font-size: 28px; color: var(--text-2); line-height: 1.4; }
.area .ico { font-family: var(--mono); font-size: 26px; color: var(--text-3); margin-bottom: 14px; display: block; direction: ltr; }
.a2 { border-color: var(--accent); } .a2 h3 { color: var(--accent); } .a3 h3 { color: var(--success); }
.chip.h1 { background: #3a2a52; border-color: #b07cf0; } .chip.h2 { background: #4a3322; border-color: #f08a4a; }
.chip { position: absolute; font-size: 34px; padding: 14px 30px; }
.c1 { top: 660px; inset-inline-start: 160px; } .c2 { top: 750px; inset-inline-start: 160px; }
@keyframes h1move { 0%, 8% { transform: translateX(0); } 38%, 56% { transform: translateX(600px); } 92%, 100% { transform: translateX(1200px); } }
.mv { animation: fx-pop calc(var(--d) * .05s) both, h1move calc(var(--d) * .52s) ease-in-out both, chipout calc(var(--d) * .03s) both; animation-delay: calc(var(--d) * .20s), calc(var(--d) * .34s), calc(var(--d) * .84s); }
@keyframes chipout { to { opacity: 0; } }
.cm { position: absolute; top: 665px; inset-inline-start: 1320px; width: 360px; display: flex; align-items: center; gap: 18px; font: 600 27px var(--mono); direction: ltr; }
.cm .dot { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 6px solid var(--success); background: #b07cf0; }
.lab { position: absolute; top: 520px; translate: -50% 0; z-index: 5; white-space: nowrap; padding: 8px 22px; border-radius: 999px; font-size: 30px; font-weight: 650; background: var(--accent-solid); }
.l1 { inset-inline-start: 660px; } .l2 { inset-inline-start: 1260px; background: var(--success); color: #07140e; }
.garrow { position: absolute; top: 690px; width: 120px; } .g1 { inset-inline-start: 600px; } .g2 { inset-inline-start: 1200px; }
.still { position: absolute; top: 915px; inset-inline-start: 120px; font-size: 36px; color: #f5a577; font-weight: 600; }
.cmt { position: absolute; top: 420px; inset-inline-start: 1400px; font-size: 28px; font-family: var(--mono); color: var(--text-1); direction: ltr; }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="row">
  <div class="area card in" style="--at:.02"><span class="ico">git status</span><h3 data-i="a1"></h3><p data-i="a1d"></p></div>
  <div class="area card a2 in" style="--at:.10"><span class="ico">index</span><h3 data-i="a2"></h3><p data-i="a2d"></p></div>
  <div class="area card a3 in" style="--at:.18"><span class="ico">.git</span><h3 data-i="a3"></h3><p data-i="a3d"></p></div>
</div>
<div class="chip h1 c1 mv">Hunk 1</div>
<div class="chip h2 c2 pop" style="--at:.22">Hunk 2</div>
<svg class="garrow g1 fade" style="--at:.34" width="120" height="60" viewBox="0 0 120 60"><path d="M6 30 H100 M80 10 L104 30 L80 50" stroke="#79839a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<svg class="garrow g2 fade" style="--at:.62" width="120" height="60" viewBox="0 0 120 60"><path d="M6 30 H100 M80 10 L104 30 L80 50" stroke="#79839a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="lab l1 pop" style="--at:.34" data-i="stage"></div>
<div class="lab l2 pop" style="--at:.62" data-i="commit"></div>
<div class="cm pop" style="--at:.86"><span class="dot"></span><span>docs(search): describe the index</span></div>
<div class="still in" style="--at:.80" data-i="still"></div>
</body></html>
<script>window.TEXT = { tag: 'Staging · Hunks', a1: 'Working tree', a1d: 'The files you edit.', a2: 'Staging area', a2d: 'What the next commit will contain.', a3: 'Repository', a3d: 'Commits, your saved history.', stage: 'Stage Hunk', commit: 'Commit', still: 'Hunk 2 stays in the working tree.' };</script>
