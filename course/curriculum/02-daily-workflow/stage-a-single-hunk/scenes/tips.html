<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.wrap { position: absolute; top: 210px; inset-inline: 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
.tip { padding: 46px 48px; height: 600px; position: relative; }
.tip .n { width: 76px; height: 76px; border-radius: 50%; background: var(--accent-solid); display: grid; place-items: center; font-size: 40px; font-weight: 700; margin-bottom: 28px; }
.tip h2 { font-size: 52px; margin-bottom: 34px; line-height: 1.35; }
html[lang='ar'] .tip p { line-height: 1.75; }
.tip p { font-size: 34px; line-height: 1.45; color: var(--text-2); }
.btn { display: inline-block; margin-top: 34px; padding: 16px 34px; border-radius: 14px; font-size: 34px; font-weight: 600; background: var(--surface-3); border: 2px solid var(--border-strong); }
.pick { margin-top: 34px; display: grid; grid-template-columns: 36px auto; gap: 14px 16px; align-items: center; justify-content: start; font-family: var(--mono); font-size: 30px; direction: ltr; }
.pick .cb { width: 32px; height: 32px; border-radius: 8px; border: 3px solid var(--accent); background: var(--accent); position: relative; }
.pick .cb.off { background: transparent; border-color: var(--border-strong); }
.pick span.t { padding: 6px 16px; border-radius: 8px; } .pick .a { background: var(--add-bg); color: var(--add-fg); }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="wrap">
  <div class="tip card in" style="--at:.05"><div class="n">1</div><h2 data-i="t1"></h2><p data-i="p1"></p><div class="btn pop" style="--at:.30">Unstage Hunk</div></div>
  <div class="tip card in" style="--at:.45"><div class="n">2</div><h2 data-i="t2"></h2><p data-i="p2"></p>
    <div class="pick pop" style="--at:.72"><div class="cb"></div><span class="t a">+ const hits = …</span><div class="cb off"></div><span class="t a">+ return hits.slice(0, limit)</span></div></div>
</div>
</body></html>
<script>window.TEXT = {
 en: { tag: 'Staging · Hunks', t1: 'Changed your mind?', p1: 'On the staged side, the same button reads Unstage Hunk. It moves the hunk back to your working changes.', t2: 'A hunk with two ideas?', p2: 'Pick individual lines instead of the whole hunk. That is the next video.' },
 ar: { tag: 'المرحلة · المقاطع', t1: 'غيّرت رأيك؟', p1: 'في الجانب المُجهَّز (staged)، يظهر الزر نفسه باسم Unstage Hunk، فيُعيد الـ hunk إلى تعديلاتك العاملة.', t2: 'الـ hunk فيه فكرتان؟', p2: 'اختر أسطرًا محددة بدل الـ hunk كاملًا. هذا موضوع الفيديو القادم.' } };</script>
