# One entry per beat: the words, and the picture they play over.
#   scene: <file in scenes/>        an HTML diagram scene, as long as the words need
#   app:   {from, to, camera}       a span of the recorded real-app take (markers from journey.mjs); its speed is
#                                   chosen so it lasts as long as the words. camera: full | {center:[x,y], zoom} (window px)
# {Shown|spoken} puts `Shown` in the captions and speaks `spoken` (the voice says `spoken`, so terms such as commands get a respelling).
beats:
  - id: hook
    scene: hook
    vo: "You fixed one bug, and in the same file you changed something else. If you commit both together, your history gets muddy. Which change was this commit about? In this video you will stage just one hunk in GitTree, and commit only that part."
    chapter: "Why commit only part of a file"

  - id: hunk-what
    scene: hunk-what
    vo: "A hunk is a block of changed lines, plus a few unchanged lines around it. This file has two. The first is a new comment above the class. The second adds a limit to the query function."
    chapter: "What is a hunk?"

  - id: three-areas
    scene: three-areas
    vo: "Git keeps your work in three places: the working tree, the staging area, and the repository. A commit takes only what is staged. So to commit one hunk, stage that hunk, then commit. The other hunk stays in your working tree."
    chapter: "The three places Git keeps your work"

  - id: open-changes
    app: {from: start, to: wip-after, camera: full}
    overlays:
      - {type: step, n: 1, text: "Open the working changes"}
    vo: "Here is {GitTree|git tree} with a small demo project. The working changes row at the top shows that files have changed. Click it."
    chapter: "Open the working changes"

  - id: pick-file
    app: {from: wip-after, to: stage-before, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 2, text: "Select the file"}
      - {type: box, rect: hunk1, from: hunks-shown, to: stage-before, pad: 4, color: [176, 124, 240]}
      - {type: box, rect: hunk2, from: hunks-shown, to: stage-before, pad: 4, color: [240, 138, 74]}
    vo: "Select the file. {GitTree|git tree} shows its diff, already split into hunks. Hunk one is the comment. Hunk two is the query change."

  - id: stage
    app: {from: stage-before, to: stage-after, camera: {center: [776, 300], zoom: 1.27}}
    overlays:
      - {type: step, n: 3, text: "Click Stage Hunk on the first hunk"}
      - {type: box, rect: stage-button, from: stage-before, to: stage-after, pad: 5, color: [176, 124, 240]}
    vo: "Every hunk has its own Stage Hunk button. Click it on the first hunk, and it moves to the staging area."
    chapter: "Stage a hunk"

  - id: lists
    app: {from: lists-begin, to: lists-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 4, text: "One file, now in two lists"}
      - {type: box, rect: unstaged-row, from: lists-begin, to: lists-mid, pad: 4, color: [240, 138, 74]}
      - {type: box, rect: staged-row, from: lists-mid, to: lists-end, pad: 4, color: [176, 124, 240]}
    vo: "Now the same file appears twice. Under Unstaged Files, it still holds the hunk we left. Under Staged Files, it holds the hunk we picked."
    chapter: "One file, two lists"

  - id: staged-view
    app: {from: staged-view-before, to: staged-view-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 5, text: "Review what is staged"}
      - {type: box, rect: staged-view, from: staged-view, to: staged-view-end, pad: 4, color: [176, 124, 240]}
    vo: "Click the staged copy to see exactly what the commit will contain. Only the comment is there."

  - id: commit
    app: {from: msg-before, to: commit-after, camera: {center: [776, 420], zoom: 1.27}}
    overlays:
      - {type: step, n: 6, text: "Write the message and commit"}
    vo: "Write a commit message, and commit. This commit holds only the comment change."
    chapter: "Commit"

  - id: rest
    app: {from: commit-after, to: rest-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 7, text: "The other hunk is still waiting"}
    vo: "The other hunk is still in your working changes, ready for its own commit."

  - id: verify
    app: {from: close-before, to: end, camera: full}
    overlays:
      - {type: step, n: 8, text: "Check the new commit"}
    vo: "Close the diff, and select the new commit. One file changed, one line added. That is how every commit stays about one thing."

  - id: git-command
    scene: git-command
    vo: "In plain Git, the same job is {git add -p|git add dash p}. Git shows each hunk and asks what to do: y to stage it, n to skip it, s to split it. Then {git diff --staged|git diff dash dash staged} shows what the commit will contain. {GitTree|git tree} does the same with one click per hunk."
    chapter: "The same in plain Git: git add -p"

  - id: tips
    scene: tips
    vo: "Two tips. If you change your mind, the same button reads Unstage Hunk on the staged side. And if one hunk mixes two ideas, pick individual lines instead. That is the next video."
    chapter: "Two tips"

  - id: recap
    scene: recap
    vo: "To recap: a hunk is a block of changed lines, Stage Hunk moves it to the staging area, and a commit takes only what is staged. Download {GitTree|git tree} free at {gittree.app|gittree dot app}. See you in the next video."
    chapter: "Recap"
