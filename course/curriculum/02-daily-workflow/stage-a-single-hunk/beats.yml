# One entry per beat: the words, and the picture they play over.
#   scene: <file in scenes/>        an HTML diagram scene, as long as the words need
#   app:   {from, to, camera}       a span of the recorded real-app take (markers from journey.mjs); its speed is
#                                   chosen so it lasts as long as the words. camera: full | {center:[x,y], zoom} (window px)
# {Shown|spoken} puts `Shown` in the captions and speaks `spoken` (the voice says `spoken`, so terms such as commands get a respelling).
beats:
  - id: hook
    scene: hook
    vo: "You fixed one thing. And while you were in the same file, you changed something else. Now Git sees one big edit. If you commit it all together, your history gets muddy. Which change was this commit about? In this video, you will learn how to stage just one hunk in GitTree, and commit only that part."

  - id: hunk-what
    scene: hunk-what
    vo: "First, what is a hunk? When Git compares two versions of a file, it groups the changed lines into blocks. Each block, together with a few unchanged lines around it, is a hunk. In our file there are two. The first is a new comment above the class. The second adds a limit to the query function."

  - id: three-areas
    scene: three-areas
    vo: "Git keeps your work in three places. The working tree holds the files you edit. The staging area holds what the next commit will contain. And the repository holds your commits. A commit takes only what is in the staging area. So to commit one hunk, move just that hunk into the staging area, then commit. The other hunk stays in your working tree."

  - id: open-changes
    app: {from: start, to: wip-after, camera: full}
    overlays:
      - {type: step, n: 1, text: "Open the working changes"}
    vo: "Here is GitTree, with a small demo project open. At the top of the graph, the working changes row tells us that files have changed. Click it."

  - id: pick-file
    app: {from: wip-after, to: stage-before, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 2, text: "Select the file"}
      - {type: box, rect: hunk1, from: hunks-shown, to: stage-before, pad: 4, color: [176, 124, 240]}
      - {type: box, rect: hunk2, from: hunks-shown, to: stage-before, pad: 4, color: [240, 138, 74]}
    vo: "Select the file. GitTree shows its diff, already split into hunks. Hunk one is the comment. Hunk two is the query change."

  - id: stage
    app: {from: stage-before, to: stage-after, camera: {center: [776, 300], zoom: 1.27}}
    overlays:
      - {type: step, n: 3, text: "Click Stage Hunk on the first hunk"}
      - {type: box, rect: stage-button, from: stage-before, to: stage-after, pad: 5, color: [176, 124, 240]}
    vo: "Every hunk has its own Stage Hunk button. Click it on the first hunk, and that hunk moves to the staging area."

  - id: lists
    app: {from: lists-begin, to: lists-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 4, text: "One file, now in two lists"}
      - {type: box, rect: unstaged-row, from: lists-begin, to: lists-mid, pad: 4, color: [240, 138, 74]}
      - {type: box, rect: staged-row, from: lists-mid, to: lists-end, pad: 4, color: [176, 124, 240]}
    vo: "Now look at the file lists. The same file appears twice. Under Unstaged Files, it still holds the hunk we left behind. Under Staged Files, it holds the hunk we picked."

  - id: staged-view
    app: {from: staged-view-before, to: staged-view-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 5, text: "Review what is staged"}
      - {type: box, rect: staged-view, from: staged-view, to: staged-view-end, pad: 4, color: [176, 124, 240]}
    vo: "Click the staged copy to see exactly what will be committed. Only the comment is there."

  - id: commit
    app: {from: msg-before, to: commit-after, camera: {center: [776, 420], zoom: 1.27}}
    overlays:
      - {type: step, n: 6, text: "Write the message and commit"}
    vo: "Write a commit message, and commit. This commit contains only the comment change."

  - id: rest
    app: {from: commit-after, to: rest-end, camera: {center: [776, 330], zoom: 1.27}}
    overlays:
      - {type: step, n: 7, text: "The other hunk is still waiting"}
    vo: "The other hunk is still in your working changes, ready for its own commit."

  - id: verify
    app: {from: close-before, to: end, camera: full}
    overlays:
      - {type: step, n: 8, text: "Check the new commit"}
    vo: "Close the diff, and select the new commit in the graph. It changed one file, with a single added line. That is how you keep every commit about one thing."

  - id: git-command
    scene: git-command
    vo: "In plain Git, the same job is done with {git add -p|git add dash p}. Git shows you each hunk, and asks what to do. Press y to stage it, n to skip it, and s to split it into smaller hunks. Here we staged the first and skipped the second. Then {git diff --staged|git diff dash dash staged} shows what the commit will contain. GitTree does the same, with one click per hunk."

  - id: tips
    scene: tips
    vo: "Two tips. First, if you change your mind, the same button reads Unstage Hunk on the staged side. Second, if one hunk mixes two ideas, pick individual lines instead of the whole hunk. That is the next video."

  - id: recap
    scene: recap
    vo: "To recap. A hunk is a block of changed lines. Stage Hunk moves it to the staging area. And a commit takes only what is staged. Download GitTree for free at {gittree.app|gittree dot app}, and see you in the next video."
