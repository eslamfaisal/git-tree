  ar: 'نطاقات إعدادات Git: النظام والعام والمحلي'
promise:
  en: Change a Git setting at the global and the local level from Preferences and see which one wins.
concept: Git settings live in scopes (system, global, local) and the narrowest scope wins.
feature: settings-git-config
commands:
- git config --list --show-scope
- git config --global <key> <value>
- git config --local <key> <value>
