<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.head { position: absolute; top: 120px; inset-inline: 120px; }
.head h2 { font-size: 72px; }
.row { position: absolute; top: 330px; inset-inline: 120px; display: flex; gap: 48px; }
.c { flex: 1; min-height: 480px; padding: 38px; }
.c .lab { font-family: var(--mono); direction: ltr; font-size: 26px; color: var(--text-3); display: block; margin-bottom: 14px; }
.c h3 { font-size: 44px; font-weight: 680; margin-bottom: 14px; line-height: 1.2; }
.c p { font-size: 31px; line-height: 1.4; color: var(--text-2); }
.c.h { border-color: var(--accent); } .c.h h3 { color: var(--accent); }
.foot { position: absolute; top: 880px; inset-inline-start: 120px; font-size: 36px; color: #f5a577; font-weight: 600; max-width: 1100px; line-height: 1.3; }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="head"><h2 class="in" style="--at:.02" data-i="title"></h2></div>
<div class="row" id="row"></div><div class="foot in" style="--at:.8" data-i="footer"></div>
<script>window.TEXT = {{DATA}};</script>
<script>
(() => { const T = window.TEXT, n = T.cards.length;
  document.getElementById('row').innerHTML = T.cards.map((c, i) => `<div class="c card in ${c.highlight ? 'h' : ''}" style="--at:${(0.12 + (0.7 / n) * i).toFixed(3)}">${c.label ? `<span class="lab">${c.label}</span>` : ''}<h3>${c.title}</h3><p>${c.text || ''}</p></div>`).join(''); })();
</script>
</body></html>
