<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.title { position: absolute; top: 150px; inset-inline: 120px; }
.kicker { font-size: 30px; color: var(--accent); font-weight: 650; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px; line-height: 1.3; }
h1 { font-size: 92px; line-height: 1.12; max-width: 1500px; }
.sub { margin-top: 28px; font-size: 42px; color: var(--text-2); max-width: 1400px; line-height: 1.35; }
.win { position: absolute; inset-inline-start: 120px; top: 520px; width: 980px; }
.q { position: absolute; top: 560px; inset-inline-start: 1180px; width: 620px; font-size: 44px; line-height: 1.35; color: var(--warning); font-weight: 600; }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="title"><div class="kicker in" style="--at:.02" data-i="kicker"></div><h1 class="in" style="--at:.05" data-i="title"></h1><p class="sub in" style="--at:.18" data-i="subtitle"></p></div>
<div id="snippet"></div><div class="q in" style="--at:.45" data-i="question"></div>
<script>window.TEXT = {{DATA}};</script>
<script>
(() => { const T = window.TEXT, s = T.snippet; if (!s) return;
  const esc = (x) => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  document.getElementById('snippet').innerHTML = `<div class="win card in" style="--at:.30"><div class="bar"><span class="dots"><s></s><s></s><s></s></span>${esc(s.file)}</div><div class="diff">` +
    s.lines.map((l) => `<div class="ln ${l[0]}"><i>${l[1]}</i>${l[0] === 'add' ? '<b>+</b> ' : l[0] === 'del' ? '<b>-</b> ' : ''}${esc(l[2])}</div>`).join('') + `</div></div>`; })();
</script>
</body></html>
