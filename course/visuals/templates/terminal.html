<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.term { position: absolute; inset-inline-start: 120px; top: 150px; width: 1230px; }
.term .body { padding: 22px 0 26px; font-family: var(--mono); direction: ltr; font-size: 27px; line-height: 1.5; background: #12151b; min-height: 560px; }
.term .l { padding: 0 30px; white-space: pre; color: #c9d1de; }
.cmd { color: #fff; font-weight: 700; } .prompt { color: var(--success); } .add { color: var(--add-fg); } .del { color: var(--del-fg); } .hunk { color: var(--accent); } .q { color: var(--warning); } .dim { color: #7c8598; }
.keys { position: absolute; top: 150px; inset-inline-start: 1410px; width: 390px; display: grid; gap: 18px; }
.key { display: flex; align-items: center; gap: 22px; padding: 18px 24px; font-size: 29px; }
.key kbd { font: 700 34px var(--mono); min-width: 64px; text-align: center; padding: 6px 0; border-radius: 12px; background: var(--surface-3); border: 2px solid var(--border-strong); box-shadow: 0 5px 0 #1e2129; }
.note { position: absolute; top: 880px; inset-inline-start: 120px; max-width: 1230px; font-size: 32px; color: var(--text-2); line-height: 1.3; }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="win term card in" style="--at:.02"><div class="bar"><span class="dots"><s></s><s></s><s></s></span><span data-i="cwd"></span></div><div class="body" id="body"></div></div>
<div class="keys" id="keys"></div><div class="note fade" style="--at:.85" data-i="note"></div>
<script>window.TEXT = {{DATA}};</script>
<script>
(() => { const T = window.TEXT, esc = (x) => x.replace(/&/g, '&amp;').replace(/</g, '&lt;'), n = T.lines.length;
  document.getElementById('body').innerHTML = T.lines.map((l, i) => {
    const at = (0.08 + (0.78 / n) * i).toFixed(3);
    const inner = l.k === 'cmd' ? `<span class="prompt">$</span> <span class="cmd">${esc(l.t)}</span>` : `<span class="${l.k}">${esc(l.t)}</span>`;
    return `<div class="l fade" style="--at:${at};--len:.02">${inner}</div>`; }).join('');
  document.getElementById('keys').innerHTML = (T.keys || []).map((k, i) => `<div class="key card in" style="--at:${(0.2 + 0.12 * i).toFixed(2)}"><kbd>${esc(k[0])}</kbd><span>${esc(k[1])}</span></div>`).join(''); })();
</script>
</body></html>
