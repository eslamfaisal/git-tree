<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.head { position: absolute; top: 110px; inset-inline: 120px; } .head h2 { font-size: 64px; }
svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.cap { position: absolute; top: 900px; inset-inline-start: 120px; max-width: 1100px; font-size: 36px; color: #f5a577; font-weight: 600; line-height: 1.3; }
.nl { font: 600 24px var(--mono); fill: var(--text-2); } .pill text { font: 700 26px var(--font); }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="head"><h2 class="in" style="--at:.02" data-i="title"></h2></div>
<svg id="g" viewBox="0 0 1920 1080"></svg><div class="cap fade" style="--at:.85" data-i="caption"></div>
<script>window.TEXT = {{DATA}};</script>
<script>
/* A commit graph drawn from data: nodes {id, x (0-11), lane (0-3), label?, at}, edges [from, to, at], refs [{name, node, color, at}]. */
(() => { const T = window.TEXT, LANES = ['#4c9aff', '#9b59e0', '#d645ce', '#4cc38a'], X0 = 240, DX = 190, Y0 = 400, DY = 150;
  const pos = (n) => [X0 + n.x * DX, Y0 + n.lane * DY], byId = Object.fromEntries(T.nodes.map((n) => [n.id, n]));
  let s = '';
  for (const [a, b, at] of T.edges) { const [x1, y1] = pos(byId[a]), [x2, y2] = pos(byId[b]);
    const d = y1 === y2 ? `M${x1} ${y1} H${x2}` : `M${x1} ${y1} C${x1 + 60} ${y1} ${x2 - 60} ${y2} ${x2} ${y2}`;
    s += `<path class="draw" style="--at:${at};--len:.06;--len-px:400" d="${d}" stroke="${LANES[byId[b].lane % 4]}" stroke-width="7" fill="none" stroke-linecap="round"/>`; }
  for (const n of T.nodes) { const [x, y] = pos(n);
    s += `<g class="pop" style="--at:${n.at};--len:.04"><circle cx="${x}" cy="${y}" r="34" fill="#1b1e26" stroke="${LANES[n.lane % 4]}" stroke-width="8"/>${n.label ? `<text class="nl" x="${x}" y="${y + 72}" text-anchor="middle">${n.label}</text>` : ''}</g>`; }
  for (const r of T.refs || []) { const n = byId[r.node], [x, y] = pos(n), w = r.name.length * 17 + 36;
    s += `<g class="pop pill" style="--at:${r.at};--len:.04"><rect x="${x - w / 2}" y="${y - 118}" width="${w}" height="46" rx="23" fill="${r.color || '#2f6fed'}"/><text x="${x}" y="${y - 86}" text-anchor="middle" fill="#fff">${r.name}</text></g>`; }
  document.getElementById('g').innerHTML = s; })();
</script>
</body></html>
