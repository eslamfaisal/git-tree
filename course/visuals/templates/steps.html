<!doctype html><html><head><meta charset="utf-8"><!--KIT--><style>
.head { position: absolute; top: 120px; inset-inline: 120px; } .head h2 { font-size: 72px; }
.list { position: absolute; top: 300px; inset-inline-start: 120px; width: 1500px; display: grid; gap: 22px; }
.s { display: flex; align-items: center; gap: 28px; padding: 24px 38px; font-size: 42px; line-height: 1.3; }
.s .n { flex: none; width: 70px; height: 70px; border-radius: 50%; background: var(--accent-solid); display: grid; place-items: center; font-size: 36px; font-weight: 700; }
.s code { font-family: var(--mono); direction: ltr; background: var(--surface-3); padding: 2px 14px; border-radius: 8px; font-size: 36px; }
</style></head><body>
<div class="brand"><img src="{{KIT}}/brand/mark.svg" alt=""><b>GitTree</b></div>
<div class="tag" data-i="tag"></div>
<div class="head"><h2 class="in" style="--at:.02" data-i="title"></h2></div>
<div class="list" id="list"></div>
<script>window.TEXT = {{DATA}};</script>
<script>
(() => { const T = window.TEXT, n = T.steps.length;
  document.getElementById('list').innerHTML = T.steps.map((t, i) => `<div class="s card in" style="--at:${(0.1 + (0.8 / n) * i).toFixed(3)}"><div class="n">${i + 1}</div><div>${t}</div></div>`).join(''); })();
</script>
</body></html>
